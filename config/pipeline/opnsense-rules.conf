// ---------------------------------------------------------------------------
// OpenVPN management interface messages
// ---------------------------------------------------------------------------

rule "OPNsense - OpenVPN management"
when
    (lowercase(to_string($message.application_name)) == "openvpn" || starts_with(lowercase(to_string($message.application_name)), "openvpn_")) &&
    contains(to_string($message.message), "MANAGEMENT:")
then
    let m = regex("^.*MANAGEMENT: (.*)$", to_string($message.message), ["management_message"]);
    set_field("opnsense_openvpn_management_message", to_string(m["management_message"]));
    set_field("opnsense_log_type", "vpn");
    set_field("opnsense_parse_status", "parsed");
    set_field("opnsense_parser", "openvpn_management");
    set_field("event_action", "openvpn_management");
end

// ---------------------------------------------------------------------------
// Zone enrichment. The lookup must be named opnsense_network_zones.
// ---------------------------------------------------------------------------

rule "OPNsense - enrich source zone"
when
    has_field("source_ip")
then
    let zone = lookup_value(lookup_table: "opnsense_network_zones", key: to_string($message.source_ip), default: "__NOT_FOUND__");
    set_field("source_zone", to_string(zone));
end

rule "OPNsense - enrich destination zone"
when
    has_field("destination_ip")
then
    let zone = lookup_value(lookup_table: "opnsense_network_zones", key: to_string($message.destination_ip), default: "__NOT_FOUND__");
    set_field("destination_zone", to_string(zone));
end

// The deployed baseline used WAN for public lookup misses. For a greenfield
// deployment, "Public" is a clearer label; see docs/architecture.md.
rule "OPNsense - source public fallback"
when
    has_field("source_ip") && to_string($message.source_zone) == "__NOT_FOUND__" && !in_private_net(to_string($message.source_ip))
then
    set_field("source_zone", "WAN");
end

rule "OPNsense - source private fallback"
when
    has_field("source_ip") && to_string($message.source_zone) == "__NOT_FOUND__" && in_private_net(to_string($message.source_ip))
then
    set_field("source_zone", "Private-Other");
end

rule "OPNsense - destination public fallback"
when
    has_field("destination_ip") && to_string($message.destination_zone) == "__NOT_FOUND__" && !in_private_net(to_string($message.destination_ip))
then
    set_field("destination_zone", "WAN");
end

rule "OPNsense - destination private fallback"
when
    has_field("destination_ip") && to_string($message.destination_zone) == "__NOT_FOUND__" && in_private_net(to_string($message.destination_ip))
then
    set_field("destination_zone", "Private-Other");
end

// ---------------------------------------------------------------------------
// Universal parser quality flag. Keep this as the final stage.
// ---------------------------------------------------------------------------

rule "OPNsense - flag unparsed"
when
    !has_field("opnsense_parse_status")
then
    set_field("opnsense_parse_status", "unparsed");
    set_field("opnsense_parser", "unparsed");
    set_field("opnsense_unparsed_subsystem", lowercase(to_string($message.application_name)));
end
