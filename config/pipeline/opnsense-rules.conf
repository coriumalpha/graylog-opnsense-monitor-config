then
    let m = regex(".*DHCP4_QUERY_LABEL received query: \\[hwtype=([0-9]+) ([0-9a-fA-F:]+)\\], cid=\\[([^]]+)\\], tid=([^ ]+).*$", to_string($message.message), ["hwtype", "mac", "client_id", "tid"]);
    set_field("dhcp_hw_type", to_long(m["hwtype"]));
    set_field("dhcp_client_mac", lowercase(to_string(m["mac"])));
    set_field("dhcp_client_id", to_string(m["client_id"]));
    set_field("dhcp_transaction_id", to_string(m["tid"]));
    set_field("event_action", "dhcp_query");
    set_field("opnsense_log_type", "dhcp");
    set_field("opnsense_parse_status", "parsed");
    set_field("opnsense_parser", "kea_dhcp_query");
end

