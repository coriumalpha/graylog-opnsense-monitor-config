// ---------------------------------------------------------------------------
// Unbound
// ---------------------------------------------------------------------------

rule "OPNsense - unbound query"
when
    lowercase(to_string($message.application_name)) == "unbound" &&
    regex("^\\[([0-9]+):([0-9]+)\\] query: ([^ ]+) ([^ ]+) ([^ ]+) ([^ ]+)$", to_string($message.message)).matches == true
then
    let m = regex("^\\[([0-9]+):([0-9]+)\\] query: ([^ ]+) ([^ ]+) ([^ ]+) ([^ ]+)$", to_string($message.message), ["pid", "worker", "client", "qname", "qtype", "qclass"]);
    set_field("opnsense_unbound_worker", to_string(m["worker"]));
    set_field("source_ip", to_ip(to_string(m["client"])));
    set_field("dns_query_name", to_string(m["qname"]));
    set_field("dns_query_type", to_string(m["qtype"]));
    set_field("dns_query_class", to_string(m["qclass"]));
    set_field("event_action", "dns_query");
    set_field("opnsense_log_type", "dns");
    set_field("opnsense_parse_status", "parsed");
    set_field("opnsense_parser", "unbound_query");
end

rule "OPNsense - unbound info"
when
    lowercase(to_string($message.application_name)) == "unbound" &&
    regex("^\\[([0-9]+):([0-9]+)\\] info: ([^ ]+) ([^ ]+) ([^ @]+)@([0-9]+) ([^ ]+) ([^ ]+) ([^ ]+)$", to_string($message.message)).matches == true
then
    let m = regex("^\\[([0-9]+):([0-9]+)\\] info: ([^ ]+) ([^ ]+) ([^ @]+)@([0-9]+) ([^ ]+) ([^ ]+) ([^ ]+)$", to_string($message.message), ["pid", "worker", "local_zone", "local_zone_action", "client", "client_port", "qname", "qtype", "qclass"]);
    set_field("opnsense_unbound_worker", to_string(m["worker"]));
    set_field("opnsense_unbound_local_zone", to_string(m["local_zone"]));
    set_field("opnsense_unbound_local_zone_action", to_string(m["local_zone_action"]));
    set_field("source_ip", to_ip(to_string(m["client"])));
    set_field("source_port", to_long(m["client_port"]));
    set_field("dns_query_name", to_string(m["qname"]));
    set_field("dns_query_type", to_string(m["qtype"]));
    set_field("dns_query_class", to_string(m["qclass"]));
    set_field("event_action", "dns_info");
    set_field("opnsense_log_type", "dns");
    set_field("opnsense_parse_status", "parsed");
    set_field("opnsense_parser", "unbound_info");
end

