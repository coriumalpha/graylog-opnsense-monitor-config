// Graylog 7.1.x pipeline rules for OPNsense RFC5424 logs.
//
// Copy each `rule ... end` block into Graylog as an individual pipeline rule.
// The firewall parsers intentionally keep OPNsense/pf context in `opnsense_*`
// fields while exposing stable canonical fields for dashboards.
//
// The exact auxiliary/admin log formats emitted by OPNsense plugins can vary
// between releases. This baseline therefore includes only formats that were
// validated in the source deployment: filterlog IPv4, Unbound, Kea and
// OpenVPN MANAGEMENT messages, plus zone enrichment and parser diagnostics.

rule "OPNsense - classify message"
when
    true
then
    set_field("event_source_product", "opnsense");
    set_field("opnsense_subsystem", lowercase(to_string($message.application_name)));
    set_field("opnsense_parser_version", "1");
end

// ---------------------------------------------------------------------------
// filterlog IPv4
// ---------------------------------------------------------------------------

rule "OPNsense - filterlog IPv4 TCP"
when
    lowercase(to_string($message.application_name)) == "filterlog" &&
    regex("^.*,(in|out),4,.*,[0-9]+,tcp,.*$", to_string($message.message)).matches == true
then
    let f = csv_to_map(
        value: to_string($message.message),
        fieldNames: "rule_number,sub_rule_number,anchor,tracker,interface,reason,action,direction,ip_version,tos,ecn,ttl,ip_id,offset,ip_flags,protocol_id,protocol_name,length,source_ip_raw,destination_ip_raw,source_port_raw,destination_port_raw,data_length,tcp_flags,sequence,ack,window,urg,tcp_options",
        trimLeadingWhitespace: true,
        ignoreExtraCsvValues: true
    );
    set_field("opnsense_rule_number", to_long(map_get(f, "rule_number")));
    set_field("opnsense_tracker", to_string(map_get(f, "tracker")));
    set_field("opnsense_interface", to_string(map_get(f, "interface")));
    set_field("opnsense_reason", to_string(map_get(f, "reason")));
    set_field("opnsense_tcp_flags", to_string(map_get(f, "tcp_flags")));
    set_field("source_ip", to_ip(to_string(map_get(f, "source_ip_raw"))));
    set_field("destination_ip", to_ip(to_string(map_get(f, "destination_ip_raw"))));
    set_field("source_port", to_long(map_get(f, "source_port_raw")));
    set_field("destination_port", to_long(map_get(f, "destination_port_raw")));
    set_field("event_action", lowercase(to_string(map_get(f, "action"))));
    set_field("network_direction", lowercase(to_string(map_get(f, "direction"))));
    set_field("network_ip_version", to_long(map_get(f, "ip_version")));
    set_field("network_iana_number", to_long(map_get(f, "protocol_id")));
    set_field("network_transport", lowercase(to_string(map_get(f, "protocol_name"))));
    set_field("network_bytes", to_long(map_get(f, "length")));
    set_field("network_data_bytes", to_long(map_get(f, "data_length")));
    set_field("opnsense_log_type", "firewall");
    set_field("opnsense_parse_status", "parsed");
    set_field("opnsense_parser", "filterlog_ipv4_tcp");
end

