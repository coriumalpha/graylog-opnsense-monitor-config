pipeline "OPNsense - Processing"
stage 0 match either
    rule "OPNsense - classify message";

stage 1 match either
    rule "OPNsense - filterlog IPv4 TCP";
    rule "OPNsense - filterlog IPv4 UDP";
    rule "OPNsense - filterlog IPv4 ICMP";
    rule "OPNsense - filterlog IPv4 IGMP";
    rule "OPNsense - unbound query";
    rule "OPNsense - unbound info";
    rule "OPNsense - unbound reply";
    rule "OPNsense - Kea DHCP query";
    rule "OPNsense - Kea DHCP packet received";
    rule "OPNsense - Kea lease allocated";
    rule "OPNsense - Kea lease reused";
    rule "OPNsense - Kea INIT-REBOOT";
    rule "OPNsense - Kea DHCP packet sent";
    rule "OPNsense - OpenVPN management";

// Stage 2 is intentionally reserved for future shared normalization.

stage 3 match either
    rule "OPNsense - enrich source zone";
    rule "OPNsense - enrich destination zone";

stage 4 match either
    rule "OPNsense - source public fallback";
    rule "OPNsense - source private fallback";
    rule "OPNsense - destination public fallback";
    rule "OPNsense - destination private fallback";

stage 5 match either
    rule "OPNsense - flag unparsed";
end
